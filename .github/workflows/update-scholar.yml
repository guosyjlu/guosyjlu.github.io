name: Update Google Scholar citations

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read total citations from the public Scholar profile
        run: python scripts/update-scholar.py --allow-stale --diagnostics-dir "$RUNNER_TEMP/scholar-diagnostics"
      - name: Save sanitized Scholar diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scholar-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scholar-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit only a changed citation count
        id: commit
        run: |
          if git diff --quiet -- assets/scholar-stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/scholar-stats.json
            git commit -m "Update Google Scholar citation count"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: refresh
    if: github.event.repository.private == false && needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare public site files
        run: |
          mkdir _site
          cp index.html style.css content.js script.js .nojekyll _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy updated count
        id: deployment
        uses: actions/deploy-pages@v4
